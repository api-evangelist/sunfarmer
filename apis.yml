name: SunFarmer
description: SunFarmer is a solar energy company operating primarily in Nepal that designs, installs,
  finances, and services solar power systems for health facilities, schools, agriculture, and businesses.
  Its mission is to make reliable solar energy affordable across underserved communities, powering water
  pumping, clinics, and irrigation. SunFarmer reports over 3.2 million cubic meters of water pumped, 1.5+
  million units of clean electricity generated, and nearly 1.8 million kilograms of CO2 offset. It offers
  a "Get Solar" customer path and a "Give Solar" donation program. It is a direct-to-customer solar
  services and social-impact provider with no public developer API surface.
